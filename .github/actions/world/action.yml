name: World
description: >
  Makes one world for one server family with setup.sh, from the harness and builds the earlier
  jobs made, reused from the cache for as long as its key stays the same, and keeps it as an
  artifact named after its target.
inputs:
  target:
    description: The setup.sh target that makes the world, which also names the artifact.
    required: true
  path:
    description: Where the world is, the cached and kept files.
    required: true
  key:
    description: What the world depends on, its cache key.
    required: true
  needs:
    description: The artifacts it is made from, as a download pattern.
    required: true
  java:
    description: Whether making it runs vanilla, which needs Java.
    default: "false"
runs:
  using: composite
  steps:
    - if: inputs.java == 'true'
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: 25
    - id: cache
      uses: actions/cache@v5
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.key }}
    - uses: actions/download-artifact@v8
      with:
        pattern: ${{ inputs.needs }}
        merge-multiple: true
    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        for archive in *.tar.gz; do tar -xzf "$archive"; done
        ./setup.sh "${{ inputs.target }}"
    # The generating server's own account of a failure, which stays on the runner otherwise.
    - if: failure()
      shell: bash
      run: for log in ${{ inputs.path }}/server.log; do [ -f "$log" ] && tail -n 200 "$log"; done; true
    - shell: bash
      run: tar -czf "${{ inputs.target }}.tar.gz" ${{ inputs.path }}
    - uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.target }}
        path: ${{ inputs.target }}.tar.gz
        retention-days: 1

name: Scenario
description: >
  Runs one scenario script on every server, one after another on this machine, from the builds
  and worlds the earlier jobs made, and keeps its results.
inputs:
  scenario:
    description: The script in scenarios/ to run, without its extension.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: 25
    - uses: actions/download-artifact@v8
      with:
        pattern: "{harness,terrain,import-lightning-rod,terrain-steel,build-*}"
        merge-multiple: true
    - shell: bash
      run: |
        # Each archive goes once unpacked, as the worlds would not all fit on the disk twice.
        for archive in *.tar.gz; do tar -xzf "$archive" && rm "$archive"; done
        MC_SERVER_BENCH_BUILT=1 "scenarios/${{ inputs.scenario }}.sh"
    - uses: actions/upload-artifact@v7
      with:
        name: results-${{ inputs.scenario }}
        path: runs/standard/results.jsonl

name: Scenario
description: >
  Runs one scenario script on one terrain on every server, one after another on this machine, from
  the harness, builds and worlds the earlier jobs keep in the cache, and keeps its results. Each is
  restored under the key the job that made it gave, with the same paths it was kept under.
inputs:
  scenario:
    description: The script in scenarios/ to run, without its extension.
    required: true
  terrain:
    description: The terrain whose runs it runs, real, flat or wide.
    required: true
  repeat:
    description: Which repetition of the scenario this is, each on a machine of its own.
    required: false
    default: "1"
  needs:
    description: The job's needs, as JSON, for the keys the jobs it needs made.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: 25
    - uses: actions/cache/restore@v5
      with:
        path: zig-out/bin/bench
        key: ${{ fromJSON(inputs.needs).harness.outputs.key }}
        fail-on-cache-miss: true
    - uses: actions/cache/restore@v5
      with:
        path: |
          servers/build/lightning-rod
          servers/build/world-import
          servers/build/versions/lightning-rod
        key: ${{ fromJSON(inputs.needs).build-lightning-rod.outputs.key }}
        fail-on-cache-miss: true
    - uses: actions/cache/restore@v5
      with:
        path: |
          servers/pumpkin/target/release/pumpkin
          servers/build/versions/pumpkin
        key: ${{ fromJSON(inputs.needs).build-pumpkin.outputs.key }}
        fail-on-cache-miss: true
    - uses: actions/cache/restore@v5
      with:
        path: |
          servers/steel/target/release/steel
          servers/steel/package-content
          servers/build/versions/steel
        key: ${{ fromJSON(inputs.needs).build-steel.outputs.key }}
        fail-on-cache-miss: true
    - uses: actions/cache/restore@v5
      with:
        path: |
          servers/vanilla
          servers/paper
          servers/folia
          servers/fabric
        key: ${{ fromJSON(inputs.needs).build-java.outputs.key }}
        fail-on-cache-miss: true
    - uses: actions/cache/restore@v5
      with:
        path: servers/build/worlds/${{ inputs.terrain }}/vanilla
        key: ${{ fromJSON(inputs.needs)[format('terrain-{0}', inputs.terrain)].outputs.key }}
        fail-on-cache-miss: true
    - uses: actions/cache/restore@v5
      with:
        path: |
          servers/build/worlds/${{ inputs.terrain }}/lightning-rod
          servers/build/worlds/${{ inputs.terrain }}/lightning-rod.version
        key: ${{ fromJSON(inputs.needs)[format('import-{0}', inputs.terrain)].outputs.key }}
        fail-on-cache-miss: true
    - uses: actions/cache/restore@v5
      with:
        path: |
          servers/build/worlds/${{ inputs.terrain }}/steel
          servers/build/worlds/${{ inputs.terrain }}/steel.version
        key: ${{ fromJSON(inputs.needs)[format('steel-{0}', inputs.terrain)].outputs.key }}
        fail-on-cache-miss: true
    - shell: bash
      run: MC_SERVER_BENCH_BUILT=1 "scenarios/${{ inputs.scenario }}.sh" --terrain=${{ inputs.terrain }} --repeat=${{ inputs.repeat }}
    - uses: actions/upload-artifact@v7
      with:
        name: results-${{ inputs.scenario }}-${{ inputs.terrain }}-${{ inputs.repeat }}
        path: runs/standard/results.jsonl
    # Every server's own log of its runs, to see from the server's side what went wrong.
    - uses: actions/upload-artifact@v7
      with:
        name: logs-${{ inputs.scenario }}-${{ inputs.terrain }}-${{ inputs.repeat }}
        path: runs/standard/**/server.log
        retention-days: 7
    # Frames a bot could not read, with the frames before and its input after, to tell a server
    # that sent bad bytes from a bot that lost its place.
    - uses: actions/upload-artifact@v7
      with:
        name: failed-frames-${{ inputs.scenario }}-${{ inputs.terrain }}-${{ inputs.repeat }}
        path: runs/standard/**/failed-frames/*.bin
        if-no-files-found: ignore
        retention-days: 30

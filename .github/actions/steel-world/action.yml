name: SteelMC world
description: >
  SteelMC's world on one terrain, the same chunks vanilla generates for every other server,
  generated by SteelMC into its own format. It is kept in the cache under a key made from SteelMC's
  build key and the recipe the harness job made from what decides it, and generated only when no
  world is kept under that key.
inputs:
  terrain:
    description: The terrain, real, flat or wide.
    required: true
  needs:
    description: The job's needs, as JSON, for the keys the jobs it needs made.
    required: true
outputs:
  key:
    description: The key the world is kept under.
    value: ${{ steps.key.outputs.key }}
runs:
  using: composite
  steps:
    - id: key
      shell: bash
      run: echo "key=steel-${{ inputs.terrain }}-$(echo "${{ fromJSON(inputs.needs).build-steel.outputs.key }} ${{ fromJSON(inputs.needs).harness.outputs[format('steel-{0}', inputs.terrain)] }}" | sha256sum | cut -c1-20)" >> "$GITHUB_OUTPUT"
    - id: cache
      uses: actions/cache/restore@v5
      with:
        path: |
          servers/build/worlds/${{ inputs.terrain }}/steel
          servers/build/worlds/${{ inputs.terrain }}/steel.version
        key: ${{ steps.key.outputs.key }}
        lookup-only: true
    - if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/restore@v5
      with:
        path: zig-out/bin/bench
        key: ${{ fromJSON(inputs.needs).harness.outputs.key }}
        fail-on-cache-miss: true
    - if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/restore@v5
      with:
        path: |
          servers/steel/target/release/steel
          servers/steel/package-content
          servers/build/versions/steel
        key: ${{ fromJSON(inputs.needs).build-steel.outputs.key }}
        fail-on-cache-miss: true
    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: ./setup.sh steel-${{ inputs.terrain }}
    - if: failure()
      shell: bash
      run: tail -n 200 servers/build/worlds/${{ inputs.terrain }}/steel/server.log || true
    - if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: |
          servers/build/worlds/${{ inputs.terrain }}/steel
          servers/build/worlds/${{ inputs.terrain }}/steel.version
        key: ${{ steps.key.outputs.key }}
    - if: steps.cache.outputs.cache-hit != 'true'
      uses: ./.github/actions/prune
      with:
        key: ${{ steps.key.outputs.key }}

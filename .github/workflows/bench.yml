# The standard benchmark. Vanilla generates the worlds once, every server builds in a job of its
# own, then every scenario runs on a machine of its own with every server on it, one after
# another, so the servers within a scenario compare on the same machine. The last job joins their
# results into one Markdown report, shown on the run's summary page and kept as an artifact.
# Toolchains are installed directly at the versions the flake pins, which is much faster than
# installing Nix on every runner.
name: Benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  # The scripts run here without entering the flake's shell.
  MC_SERVER_BENCH_SHELL: 1
  # Lightning Rod's build needs its Zig cache outside the repository.
  ZIG_LOCAL_CACHE_DIR: /tmp/mc-server-bench-zig

jobs:
  terrain:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      # Zig 0.17.0, which the flake pins, checked against the hash ziglang.org publishes.
      - run: |
          curl -fsSL -o "$RUNNER_TEMP/zig.tar.xz" https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz
          echo "1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026  $RUNNER_TEMP/zig.tar.xz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - id: keys
        run: |
          echo "lightning-rod=$(git rev-parse HEAD:servers/lightning-rod)" >> "$GITHUB_OUTPUT"
          # The worlds depend only on the vanilla release and the settings and code that generate
          # them, of which setup.sh holds the release and the flat layers.
          echo "terrain=$( (grep -E '^sha=|generator-settings|level-type' setup.sh; cat src/main.zig src/server.zig src/config.zig) | sha256sum | cut -c1-20)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: |
            servers/build/terrain/vanilla
            servers/build/flat
          key: terrain-${{ steps.keys.outputs.terrain }}
      # Zig's compile caches, so an unchanged harness builds in seconds and a changed one rebuilds
      # only what changed since the last.
      - uses: actions/cache@v5
        with:
          path: |
            /tmp/mc-server-bench-zig
            ~/.cache/zig
          key: zig-harness-${{ steps.keys.outputs.lightning-rod }}-${{ hashFiles('build.zig', 'build.zig.zon', 'src/**') }}
          restore-keys: zig-harness-
      - run: ./setup.sh bench terrain
      # Vanilla's own account of a failed world generation, which stays on the runner otherwise.
      - if: failure()
        run: tail -n 200 servers/build/terrain/vanilla/server.log || true
      - run: |
          tar -czf harness.tar.gz zig-out/bin/bench
          tar -czf terrain.tar.gz servers/build/terrain/vanilla servers/build/flat
      - uses: actions/upload-artifact@v7
        with:
          name: harness
          path: harness.tar.gz
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: terrain
          path: terrain.tar.gz
          retention-days: 1

  build:
    name: build ${{ matrix.name }}
    needs: terrain
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # What setup.sh builds, the inputs that decide the build, and what the runs need of it.
          - name: lightning-rod
            targets: lightning-rod
            submodules: lightning-rod
            inputs: setup.sh build.zig build.zig.zon src/lightning_rod_server.zig src/config.zig src/main.zig src/server.zig
            outputs: servers/build/lightning-rod servers/build/terrain/lightning-rod servers/build/versions/lightning-rod
          - name: pumpkin
            targets: pumpkin
            submodules: pumpkin
            inputs: setup.sh
            outputs: servers/pumpkin/target/release/pumpkin servers/build/versions/pumpkin
          - name: steel
            targets: steel
            submodules: steel
            inputs: setup.sh patches/steel-console-stdin.patch
            outputs: servers/steel/target/release/steel servers/steel/package-content servers/build/versions/steel
          - name: java
            targets: vanilla paper paper-antixray-1 fabric fabric-occlusion
            submodules: occlusion
            inputs: setup.sh patches/occlusion-26.2.patch
            outputs: servers/vanilla servers/paper servers/fabric
    steps:
      - uses: actions/checkout@v7
      - id: key
        run: |
          commits=$(for name in ${{ matrix.submodules }}; do git rev-parse "HEAD:servers/$name"; done)
          echo "key=build-${{ matrix.name }}-$( (echo "$commits"; cat ${{ matrix.inputs }}) | sha256sum | cut -c1-20)" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@v5
        with:
          path: build-${{ matrix.name }}.tar.gz
          key: ${{ steps.key.outputs.key }}
      # Zig 0.17.0, which the flake pins, checked against the hash ziglang.org publishes.
      - if: steps.cache.outputs.cache-hit != 'true' && matrix.name == 'lightning-rod'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/zig.tar.xz" https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz
          echo "1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026  $RUNNER_TEMP/zig.tar.xz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
      # Zig's compile caches from the last Lightning Rod build, so a new commit rebuilds only what
      # it changed.
      - if: steps.cache.outputs.cache-hit != 'true' && matrix.name == 'lightning-rod'
        uses: actions/cache@v5
        with:
          path: |
            /tmp/mc-server-bench-zig
            ~/.cache/zig
          key: zig-${{ steps.key.outputs.key }}
          restore-keys: zig-build-lightning-rod-
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      # SteelMC links with lld.
      - if: steps.cache.outputs.cache-hit != 'true' && matrix.name == 'steel'
        run: sudo apt-get update && sudo apt-get install -y lld
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v8
        with:
          name: terrain
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          tar -xzf terrain.tar.gz
          ./setup.sh ${{ matrix.targets }}
          tar -czf build-${{ matrix.name }}.tar.gz ${{ matrix.outputs }}
      - uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.name }}
          path: build-${{ matrix.name }}.tar.gz
          retention-days: 1

  bench:
    name: bench ${{ matrix.scenario }}
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        scenario: [idle, wander, spread, explore, build]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/download-artifact@v8
        with:
          pattern: "{harness,terrain,build-*}"
          merge-multiple: true
      - run: for archive in *.tar.gz; do tar -xzf "$archive"; done
      - run: MC_SERVER_BENCH_BUILT=1 ./run.sh --scenarios=${{ matrix.scenario }}
      # The report and its charts for the runs that finished, when the sweep stopped early.
      - if: failure()
        run: test ! -f runs/standard/results.jsonl || ./zig-out/bin/bench report runs/standard
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-${{ matrix.scenario }}
          path: runs/standard/results.jsonl
          if-no-files-found: ignore
      # Each chart unzipped, as an artifact of its own named after its file, so the report can
      # show it as an image.
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          path: runs/standard/charts/real-${{ matrix.scenario }}.svg
          archive: false
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          path: runs/standard/charts/flat-${{ matrix.scenario }}.svg
          archive: false
          if-no-files-found: ignore

  report:
    needs: bench
    if: always()
    runs-on: ubuntu-26.04
    # To find the charts the scenario jobs uploaded.
    permissions:
      actions: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: harness
      - uses: actions/download-artifact@v8
        with:
          pattern: results-*
          path: results
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -xzf harness.tar.gz
          mkdir -p runs/standard
          cat results/*/results.jsonl > runs/standard/results.jsonl
          # The page of every chart, which the report shows as an image.
          gh api --paginate "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq '.artifacts[] | select(.name | endswith(".svg")) | "\(.name) ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/\(.id)"' > chart-urls.txt
          ./zig-out/bin/bench report runs/standard --chart-urls=chart-urls.txt
          cat runs/standard/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: report
          path: |
            runs/standard/report.md
            runs/standard/results.jsonl
            runs/standard/charts

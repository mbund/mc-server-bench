# The standard benchmark. The harness, every server and the worlds runs start from are made in
# jobs of their own and kept in the cache, each under a key made from only what decides it, so
# each is made again only when that changes. A job whose result is already kept only checks so
# and ends. Then every scenario runs on each of its terrains in a job of its own, once every server
# and that terrain's worlds are ready, with every server one after another on that job's machine,
# so the servers within a scenario compare on the same machine. The last job joins their results
# into one Markdown report, shown on the run's summary page and kept as an artifact. Toolchains are
# installed directly at the versions the flake pins, which is much faster than installing Nix on
# every runner.
name: Benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]

# Pruning the cache deletes entries.
permissions:
  contents: read
  actions: write

env:
  # The scripts run here without entering the flake's shell.
  MC_SERVER_BENCH_SHELL: 1
  # Lightning Rod's build needs its Zig cache outside the repository.
  ZIG_LOCAL_CACHE_DIR: /tmp/mc-server-bench-zig
  # Servers run on other machines than the ones that built them, all of which have AVX2.
  MC_SERVER_BENCH_CPU: x86_64_v3

jobs:
  # The harness that generates the worlds and drives every run, and the keys of the worlds it
  # generates, made from the recipe it prints for each: the square, the settings the server
  # generates from and the code that generates it, with vanilla's release or SteelMC's build.
  harness:
    runs-on: ubuntu-26.04
    outputs:
      key: ${{ steps.key.outputs.key }}
      vanilla-real: ${{ steps.worlds.outputs.vanilla-real }}
      vanilla-flat: ${{ steps.worlds.outputs.vanilla-flat }}
      vanilla-wide: ${{ steps.worlds.outputs.vanilla-wide }}
      steel-real: ${{ steps.worlds.outputs.steel-real }}
      steel-flat: ${{ steps.worlds.outputs.steel-flat }}
      steel-wide: ${{ steps.worlds.outputs.steel-wide }}
      vanilla-tiled: ${{ steps.worlds.outputs.vanilla-tiled }}
      steel-tiled: ${{ steps.worlds.outputs.steel-tiled }}
    steps:
      - uses: actions/checkout@v7
      # Its sources, Lightning Rod's protocol packages, the toolchain and the CPU it targets.
      - id: key
        run: echo "key=harness-$( (git rev-parse HEAD:servers/lightning-rod; echo "$MC_SERVER_BENCH_CPU"; grep '^if wants bench; then' setup.sh; cat build.zig build.zig.zon .github/actions/zig/action.yml; find src -type f | sort | xargs cat) | sha256sum | cut -c1-20)" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache/restore@v5
        with:
          path: zig-out/bin/bench
          key: ${{ steps.key.outputs.key }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/zig
      # Zig's compile caches, so a changed harness rebuilds only what changed since the last.
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache@v5
        with:
          path: |
            /tmp/mc-server-bench-zig
            ~/.cache/zig
          key: zig-${{ steps.key.outputs.key }}
          restore-keys: zig-harness-
      - if: steps.cache.outputs.cache-hit != 'true'
        run: ./setup.sh bench
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: zig-out/bin/bench
          key: ${{ steps.key.outputs.key }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/prune
        with:
          key: ${{ steps.key.outputs.key }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/prune
        with:
          key: zig-${{ steps.key.outputs.key }}
      - id: worlds
        run: |
          for terrain in real flat wide tiled; do
            echo "vanilla-$terrain=vanilla-$terrain-$( (./zig-out/bin/bench recipe --server=vanilla --terrain=$terrain; grep '^sha=' setup.sh; sed -n '/^pregenerate() {/,/^}/p' setup.sh) | sha256sum | cut -c1-20)" >> "$GITHUB_OUTPUT"
            echo "steel-$terrain=$( (./zig-out/bin/bench recipe --server=steel --terrain=$terrain; sed -n '/^pregenerate() {/,/^}/p; /^steel_world() {/,/^}/p' setup.sh) | sha256sum | cut -c1-20)" >> "$GITHUB_OUTPUT"
          done

  # Each server, kept for as long as its commit, its part of setup.sh, the patches it applies and
  # the CPU it targets stay the same. Builds need no worlds, so they start at once.

  # Lightning Rod in ReleaseSafe, with the tool that imports vanilla worlds into it.
  build-lightning-rod:
    runs-on: ubuntu-26.04
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v7
      # Its commit and the bench's files its build reads: the server it builds from Lightning
      # Rod's packages and the settings that server shares with the bench.
      - id: key
        run: echo "key=lightning-rod-$( (git rev-parse HEAD:servers/lightning-rod; echo "$MC_SERVER_BENCH_CPU"; awk '/^if wants lightning-rod; then/,/^fi$/' setup.sh; cat build.zig build.zig.zon src/lightning_rod_server.zig src/config.zig .github/actions/zig/action.yml) | sha256sum | cut -c1-20)" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache/restore@v5
        with:
          path: |
            servers/build/lightning-rod
            servers/build/world-import
            servers/build/versions/lightning-rod
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/zig
      # Zig's compile caches from the last Lightning Rod build, so a new commit rebuilds only what
      # it changed.
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache@v5
        with:
          path: |
            /tmp/mc-server-bench-zig
            ~/.cache/zig
          key: zig-${{ steps.key.outputs.key }}
          restore-keys: zig-lightning-rod-
      # Gradle's downloads for the snapshotter that extracts every release's registries, as Maven
      # Central turns away runners that fetch them all anew too often.
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ steps.key.outputs.key }}
          restore-keys: gradle-lightning-rod-
      # Once more after a pause if Maven Central turned it away, keeping what was extracted.
      - if: steps.cache.outputs.cache-hit != 'true'
        run: ./setup.sh lightning-rod || { sleep 120; ./setup.sh lightning-rod; }
      # The compile and download caches restored above go before their new generation is saved.
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/prune
        with:
          key: zig-${{ steps.key.outputs.key }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/prune
        with:
          key: gradle-${{ steps.key.outputs.key }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            servers/build/lightning-rod
            servers/build/world-import
            servers/build/versions/lightning-rod
          key: ${{ steps.key.outputs.key }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/prune
        with:
          key: ${{ steps.key.outputs.key }}

  build-pumpkin:
    runs-on: ubuntu-26.04
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v7
      - id: key
        run: echo "key=pumpkin-$( (git rev-parse HEAD:servers/pumpkin; echo "$MC_SERVER_BENCH_CPU"; awk '/^if wants pumpkin; then/,/^fi$/' setup.sh) | sha256sum | cut -c1-20)" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache/restore@v5
        with:
          path: |
            servers/pumpkin/target/release/pumpkin
            servers/build/versions/pumpkin
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - if: steps.cache.outputs.cache-hit != 'true'
        run: ./setup.sh pumpkin
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            servers/pumpkin/target/release/pumpkin
            servers/build/versions/pumpkin
          key: ${{ steps.key.outputs.key }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/prune
        with:
          key: ${{ steps.key.outputs.key }}

  build-steel:
    runs-on: ubuntu-26.04
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v7
      - id: key
        run: echo "key=steel-$( (git rev-parse HEAD:servers/steel; echo "$MC_SERVER_BENCH_CPU"; awk '/^if wants steel; then/,/^fi$/' setup.sh; cat patches/steel-*.patch) | sha256sum | cut -c1-20)" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache/restore@v5
        with:
          path: |
            servers/steel/target/release/steel
            servers/steel/package-content
            servers/build/versions/steel
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      # SteelMC links with lld.
      - if: steps.cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y lld
      - if: steps.cache.outputs.cache-hit != 'true'
        run: ./setup.sh steel
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            servers/steel/target/release/steel
            servers/steel/package-content
            servers/build/versions/steel
          key: ${{ steps.key.outputs.key }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/prune
        with:
          key: ${{ steps.key.outputs.key }}

  # Vanilla, Paper, Paper with FPAntiFreecam, Folia and Fabric with its mods, kept for as long as
  # their parts of setup.sh, from vanilla's jar to the end, stay the same.
  build-java:
    runs-on: ubuntu-26.04
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v7
      - id: key
        run: echo "key=java-$( (awk '/^# Vanilla 26.2/,/^fi$/' setup.sh; sed -n '/^# Downloads a list of/,$p' setup.sh) | sha256sum | cut -c1-20)" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache/restore@v5
        with:
          path: |
            servers/vanilla
            servers/paper
            servers/folia
            servers/fabric
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - if: steps.cache.outputs.cache-hit != 'true'
        run: ./setup.sh vanilla paper paper-antifreecam folia fabric-optimized
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            servers/vanilla
            servers/paper
            servers/folia
            servers/fabric
          key: ${{ steps.key.outputs.key }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/prune
        with:
          key: ${{ steps.key.outputs.key }}

  # The worlds runs start from, each in a job of its own for each server family, so a run on a
  # terrain waits only for that terrain's worlds: vanilla's, which every server reading vanilla
  # worlds starts from, Lightning Rod's imported from them, and SteelMC's own.

  terrain-real:
    needs: harness
    runs-on: ubuntu-26.04
    outputs:
      key: ${{ steps.world.outputs.key }}
    steps:
      - uses: actions/checkout@v7
      - id: world
        uses: ./.github/actions/vanilla-world
        with:
          terrain: real
          needs: ${{ toJSON(needs) }}

  terrain-flat:
    needs: harness
    runs-on: ubuntu-26.04
    outputs:
      key: ${{ steps.world.outputs.key }}
    steps:
      - uses: actions/checkout@v7
      - id: world
        uses: ./.github/actions/vanilla-world
        with:
          terrain: flat
          needs: ${{ toJSON(needs) }}

  terrain-wide:
    needs: harness
    runs-on: ubuntu-26.04
    outputs:
      key: ${{ steps.world.outputs.key }}
    steps:
      - uses: actions/checkout@v7
      - id: world
        uses: ./.github/actions/vanilla-world
        with:
          terrain: wide
          needs: ${{ toJSON(needs) }}

  terrain-tiled:
    needs: harness
    runs-on: ubuntu-26.04
    outputs:
      key: ${{ steps.world.outputs.key }}
    steps:
      - uses: actions/checkout@v7
      - id: world
        uses: ./.github/actions/vanilla-world
        with:
          terrain: tiled
          needs: ${{ toJSON(needs) }}

  import-real:
    needs: [terrain-real, build-lightning-rod]
    runs-on: ubuntu-26.04
    outputs:
      key: ${{ steps.world.outputs.key }}
    steps:
      - uses: actions/checkout@v7
      - id: world
        uses: ./.github/actions/lightning-rod-world
        with:
          terrain: real
          needs: ${{ toJSON(needs) }}

  import-flat:
    needs: [terrain-flat, build-lightning-rod]
    runs-on: ubuntu-26.04
    outputs:
      key: ${{ steps.world.outputs.key }}
    steps:
      - uses: actions/checkout@v7
      - id: world
        uses: ./.github/actions/lightning-rod-world
        with:
          terrain: flat
          needs: ${{ toJSON(needs) }}

  import-wide:
    needs: [terrain-wide, build-lightning-rod]
    runs-on: ubuntu-26.04
    outputs:
      key: ${{ steps.world.outputs.key }}
    steps:
      - uses: actions/checkout@v7
      - id: world
        uses: ./.github/actions/lightning-rod-world
        with:
          terrain: wide
          needs: ${{ toJSON(needs) }}

  import-tiled:
    needs: [terrain-tiled, build-lightning-rod]
    runs-on: ubuntu-26.04
    outputs:
      key: ${{ steps.world.outputs.key }}
    steps:
      - uses: actions/checkout@v7
      - id: world
        uses: ./.github/actions/lightning-rod-world
        with:
          terrain: tiled
          needs: ${{ toJSON(needs) }}

  steel-real:
    needs: [harness, build-steel]
    runs-on: ubuntu-26.04
    outputs:
      key: ${{ steps.world.outputs.key }}
    steps:
      - uses: actions/checkout@v7
      - id: world
        uses: ./.github/actions/steel-world
        with:
          terrain: real
          needs: ${{ toJSON(needs) }}

  steel-flat:
    needs: [harness, build-steel]
    runs-on: ubuntu-26.04
    outputs:
      key: ${{ steps.world.outputs.key }}
    steps:
      - uses: actions/checkout@v7
      - id: world
        uses: ./.github/actions/steel-world
        with:
          terrain: flat
          needs: ${{ toJSON(needs) }}

  steel-wide:
    needs: [harness, build-steel]
    runs-on: ubuntu-26.04
    outputs:
      key: ${{ steps.world.outputs.key }}
    steps:
      - uses: actions/checkout@v7
      - id: world
        uses: ./.github/actions/steel-world
        with:
          terrain: wide
          needs: ${{ toJSON(needs) }}

  steel-tiled:
    needs: [harness, build-steel]
    runs-on: ubuntu-26.04
    outputs:
      key: ${{ steps.world.outputs.key }}
    steps:
      - uses: actions/checkout@v7
      - id: world
        uses: ./.github/actions/steel-world
        with:
          terrain: tiled
          needs: ${{ toJSON(needs) }}

  # Every scenario on each of its terrains on a machine of its own, every server in turn.

  idle-real:
    needs: [harness, build-lightning-rod, build-pumpkin, build-steel, build-java, terrain-real, import-real, steel-real]
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    # Each scenario twice, each on a machine of its own, as shared runners vary from one to the
    # next: how far apart the two land shows how far one run can be trusted.
    strategy:
      fail-fast: false
      matrix:
        repeat: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/scenario
        with:
          scenario: idle
          terrain: real
          repeat: ${{ matrix.repeat }}
          needs: ${{ toJSON(needs) }}

  idle-flat:
    needs: [harness, build-lightning-rod, build-pumpkin, build-steel, build-java, terrain-flat, import-flat, steel-flat]
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    # Each scenario twice, each on a machine of its own, as shared runners vary from one to the
    # next: how far apart the two land shows how far one run can be trusted.
    strategy:
      fail-fast: false
      matrix:
        repeat: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/scenario
        with:
          scenario: idle
          terrain: flat
          repeat: ${{ matrix.repeat }}
          needs: ${{ toJSON(needs) }}

  wander-real:
    needs: [harness, build-lightning-rod, build-pumpkin, build-steel, build-java, terrain-real, import-real, steel-real]
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    # Each scenario twice, each on a machine of its own, as shared runners vary from one to the
    # next: how far apart the two land shows how far one run can be trusted.
    strategy:
      fail-fast: false
      matrix:
        repeat: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/scenario
        with:
          scenario: wander
          terrain: real
          repeat: ${{ matrix.repeat }}
          needs: ${{ toJSON(needs) }}

  wander-flat:
    needs: [harness, build-lightning-rod, build-pumpkin, build-steel, build-java, terrain-flat, import-flat, steel-flat]
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    # Each scenario twice, each on a machine of its own, as shared runners vary from one to the
    # next: how far apart the two land shows how far one run can be trusted.
    strategy:
      fail-fast: false
      matrix:
        repeat: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/scenario
        with:
          scenario: wander
          terrain: flat
          repeat: ${{ matrix.repeat }}
          needs: ${{ toJSON(needs) }}

  spread-tiled:
    needs: [harness, build-lightning-rod, build-pumpkin, build-steel, build-java, terrain-tiled, import-tiled, steel-tiled]
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    # Each scenario twice, each on a machine of its own, as shared runners vary from one to the
    # next: how far apart the two land shows how far one run can be trusted.
    strategy:
      fail-fast: false
      matrix:
        repeat: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/scenario
        with:
          scenario: spread
          terrain: tiled
          repeat: ${{ matrix.repeat }}
          needs: ${{ toJSON(needs) }}

  spread-wide:
    needs: [harness, build-lightning-rod, build-pumpkin, build-steel, build-java, terrain-wide, import-wide, steel-wide]
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    # Each scenario twice, each on a machine of its own, as shared runners vary from one to the
    # next: how far apart the two land shows how far one run can be trusted.
    strategy:
      fail-fast: false
      matrix:
        repeat: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/scenario
        with:
          scenario: spread
          terrain: wide
          repeat: ${{ matrix.repeat }}
          needs: ${{ toJSON(needs) }}

  explore:
    needs: [harness, build-lightning-rod, build-pumpkin, build-steel, build-java, terrain-flat, import-flat, steel-flat]
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    # Each scenario twice, each on a machine of its own, as shared runners vary from one to the
    # next: how far apart the two land shows how far one run can be trusted.
    strategy:
      fail-fast: false
      matrix:
        repeat: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/scenario
        with:
          scenario: explore
          terrain: flat
          repeat: ${{ matrix.repeat }}
          needs: ${{ toJSON(needs) }}

  build:
    needs: [harness, build-lightning-rod, build-pumpkin, build-steel, build-java, terrain-flat, import-flat, steel-flat]
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    # Each scenario twice, each on a machine of its own, as shared runners vary from one to the
    # next: how far apart the two land shows how far one run can be trusted.
    strategy:
      fail-fast: false
      matrix:
        repeat: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/scenario
        with:
          scenario: build
          terrain: flat
          repeat: ${{ matrix.repeat }}
          needs: ${{ toJSON(needs) }}

  cows:
    needs: [harness, build-lightning-rod, build-pumpkin, build-steel, build-java, terrain-flat, import-flat, steel-flat]
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    # Each scenario twice, each on a machine of its own, as shared runners vary from one to the
    # next: how far apart the two land shows how far one run can be trusted.
    strategy:
      fail-fast: false
      matrix:
        repeat: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/scenario
        with:
          scenario: cows
          terrain: flat
          repeat: ${{ matrix.repeat }}
          needs: ${{ toJSON(needs) }}

  warp:
    needs: [harness, build-lightning-rod, build-pumpkin, build-steel, build-java, terrain-flat, import-flat, steel-flat]
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    # Each scenario twice, each on a machine of its own, as shared runners vary from one to the
    # next: how far apart the two land shows how far one run can be trusted.
    strategy:
      fail-fast: false
      matrix:
        repeat: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/scenario
        with:
          scenario: warp
          terrain: flat
          repeat: ${{ matrix.repeat }}
          needs: ${{ toJSON(needs) }}

  # Every scenario's results in one report, also when one of them failed. Its charts go to the
  # charts branch, a folder per run, which serves them as images the run's summary can show.
  report:
    needs: [harness, idle-real, idle-flat, wander-real, wander-flat, spread-tiled, spread-wide, explore, build, cows, warp]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache/restore@v5
        with:
          path: zig-out/bin/bench
          key: ${{ needs.harness.outputs.key }}
          fail-on-cache-miss: true
      - uses: actions/download-artifact@v8
        with:
          pattern: results-*
          path: results
      - run: |
          mkdir -p runs/standard
          cat results/*/results.jsonl > runs/standard/results.jsonl
          ./zig-out/bin/bench report runs/standard --charts-url="https://raw.githubusercontent.com/${{ github.repository }}/charts/${{ github.run_id }}"
          cat runs/standard/report.md >> "$GITHUB_STEP_SUMMARY"
      - run: |
          if git fetch --depth=1 origin charts; then
            git worktree add charts-branch FETCH_HEAD
          else
            git worktree add --orphan -b charts charts-branch
          fi
          cd charts-branch
          mkdir -p "${{ github.run_id }}"
          cp ../runs/standard/charts/*.svg "${{ github.run_id }}/"
          git add "${{ github.run_id }}"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "charts: run ${{ github.run_id }}"
          # Runs finishing together each add their own folder, so a push that lost the race
          # takes the other's first.
          for _ in 1 2; do
            git push origin HEAD:charts && exit 0
            git pull --rebase --depth=1 origin charts
          done
          git push origin HEAD:charts
      - uses: actions/upload-artifact@v7
        with:
          name: report
          path: |
            runs/standard/report.md
            runs/standard/results.jsonl
            runs/standard/charts

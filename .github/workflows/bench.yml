# The standard benchmark. The harness, every server and the worlds runs start from are made in
# jobs of their own, each starting as soon as what it needs is ready. Then every scenario runs in
# a job of its own, with every server one after another on that job's machine, so the servers
# within a scenario compare on the same machine. The last job joins their results into one
# Markdown report, shown on the run's summary page and kept as an artifact. Toolchains are
# installed directly at the versions the flake pins, which is much faster than installing Nix on
# every runner.
name: Benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  # The scripts run here without entering the flake's shell.
  MC_SERVER_BENCH_SHELL: 1
  # Lightning Rod's build needs its Zig cache outside the repository.
  ZIG_LOCAL_CACHE_DIR: /tmp/mc-server-bench-zig
  # Servers run on other machines than the ones that built them, all of which have AVX2.
  MC_SERVER_BENCH_CPU: x86_64_v3

jobs:
  # The harness that generates the worlds and drives every run.
  harness:
    runs-on: ubuntu-26.04
    outputs:
      # What the worlds depend on: the vanilla release and the code that generates them.
      terrain: ${{ steps.keys.outputs.terrain }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/zig
      - id: keys
        run: |
          echo "lightning-rod=$(git rev-parse HEAD:servers/lightning-rod)" >> "$GITHUB_OUTPUT"
          echo "terrain=$( (grep -E '^sha=' setup.sh; cat src/main.zig src/server.zig src/config.zig) | sha256sum | cut -c1-20)" >> "$GITHUB_OUTPUT"
      # Zig's compile caches, so an unchanged harness builds in seconds and a changed one rebuilds
      # only what changed since the last.
      - uses: actions/cache@v5
        with:
          path: |
            /tmp/mc-server-bench-zig
            ~/.cache/zig
          key: zig-harness-${{ steps.keys.outputs.lightning-rod }}-${{ hashFiles('build.zig', 'build.zig.zon', 'src/**') }}
          restore-keys: zig-harness-
      - run: |
          ./setup.sh bench
          tar -czf harness.tar.gz zig-out/bin/bench
      - uses: actions/upload-artifact@v7
        with:
          name: harness
          path: harness.tar.gz
          retention-days: 1

  # Vanilla's real and flat worlds, which every server reading vanilla worlds starts from.
  terrain:
    needs: harness
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/download-artifact@v8
        with:
          name: harness
      - id: cache
        uses: actions/cache@v5
        with:
          path: |
            servers/build/worlds/real/vanilla
            servers/build/worlds/flat/vanilla
          key: worlds-vanilla-${{ needs.harness.outputs.terrain }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          tar -xzf harness.tar.gz
          ./setup.sh terrain
      # Vanilla's own account of a failed world generation, which stays on the runner otherwise.
      - if: failure()
        run: tail -n 200 servers/build/worlds/*/vanilla/server.log
      - run: tar -czf terrain.tar.gz servers/build/worlds/real/vanilla servers/build/worlds/flat/vanilla
      - uses: actions/upload-artifact@v7
        with:
          name: terrain
          path: terrain.tar.gz
          retention-days: 1

  # Vanilla's wide flat world, which only spread runs on and which takes far longer, so nothing else
  # waits for it.
  terrain-wide:
    needs: harness
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/download-artifact@v8
        with:
          name: harness
      - id: cache
        uses: actions/cache@v5
        with:
          path: servers/build/worlds/wide/vanilla
          key: worlds-wide-vanilla-${{ needs.harness.outputs.terrain }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          tar -xzf harness.tar.gz
          ./setup.sh terrain-wide
      - if: failure()
        run: tail -n 200 servers/build/worlds/wide/vanilla/server.log
      - run: tar -czf wide-vanilla.tar.gz servers/build/worlds/wide/vanilla
      - uses: actions/upload-artifact@v7
        with:
          name: wide-vanilla
          path: wide-vanilla.tar.gz
          retention-days: 1

  # Each build is reused for as long as its submodule's commit and the files that decide it stay
  # the same, and only the build itself is skipped when it is. Builds need no worlds, so they
  # start at once, alongside generating them.

  # Lightning Rod in ReleaseSafe, with the tool that imports vanilla worlds into it.
  build-lightning-rod:
    runs-on: ubuntu-26.04
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v7
      - id: key
        run: echo "key=lightning-rod-$( (git rev-parse HEAD:servers/lightning-rod; awk '/^if wants lightning-rod; then/,/^fi$/' setup.sh; cat build.zig build.zig.zon src/lightning_rod_server.zig src/config.zig) | sha256sum | cut -c1-20)" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@v5
        with:
          path: build-lightning-rod.tar.gz
          key: ${{ steps.key.outputs.key }}
      - uses: ./.github/actions/zig
      # Zig's compile caches from the last Lightning Rod build, so a new commit rebuilds only what
      # it changed.
      - uses: actions/cache@v5
        with:
          path: |
            /tmp/mc-server-bench-zig
            ~/.cache/zig
          key: zig-${{ steps.key.outputs.key }}
          restore-keys: zig-lightning-rod-
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          ./setup.sh lightning-rod
          tar -czf build-lightning-rod.tar.gz servers/build/lightning-rod servers/build/world-import servers/build/versions/lightning-rod
      - uses: actions/upload-artifact@v7
        with:
          name: build-lightning-rod
          path: build-lightning-rod.tar.gz
          retention-days: 1

  build-pumpkin:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      # Pumpkin depends on only its own part of setup.sh.
      - id: key
        run: echo "key=pumpkin-$( (git rev-parse HEAD:servers/pumpkin; awk '/^if wants pumpkin; then/,/^fi$/' setup.sh) | sha256sum | cut -c1-20)" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@v5
        with:
          path: build-pumpkin.tar.gz
          key: ${{ steps.key.outputs.key }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          ./setup.sh pumpkin
          tar -czf build-pumpkin.tar.gz servers/pumpkin/target/release/pumpkin servers/build/versions/pumpkin
      - uses: actions/upload-artifact@v7
        with:
          name: build-pumpkin
          path: build-pumpkin.tar.gz
          retention-days: 1

  build-steel:
    runs-on: ubuntu-26.04
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v7
      # SteelMC depends on only its own part of setup.sh and the patches that part applies.
      - id: key
        run: echo "key=steel-$( (git rev-parse HEAD:servers/steel; awk '/^if wants steel; then/,/^fi$/' setup.sh; cat patches/steel-*.patch) | sha256sum | cut -c1-20)" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@v5
        with:
          path: build-steel.tar.gz
          key: ${{ steps.key.outputs.key }}
      # SteelMC links with lld.
      - run: sudo apt-get update && sudo apt-get install -y lld
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          ./setup.sh steel
          tar -czf build-steel.tar.gz servers/steel/target/release/steel servers/steel/package-content servers/build/versions/steel
      - uses: actions/upload-artifact@v7
        with:
          name: build-steel
          path: build-steel.tar.gz
          retention-days: 1

  # Vanilla, Paper and Fabric, with Occlusion built from its patched source.
  build-java:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - id: key
        run: echo "key=java-$( (git rev-parse HEAD:servers/occlusion; cat setup.sh patches/occlusion-26.2.patch) | sha256sum | cut -c1-20)" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@v5
        with:
          path: build-java.tar.gz
          key: ${{ steps.key.outputs.key }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          ./setup.sh vanilla paper paper-antixray-1 fabric fabric-occlusion
          tar -czf build-java.tar.gz servers/vanilla servers/paper servers/fabric
      - uses: actions/upload-artifact@v7
        with:
          name: build-java
          path: build-java.tar.gz
          retention-days: 1

  # Lightning Rod's worlds: vanilla's imported, reused for as long as its build and vanilla's
  # worlds stay the same. The wide one is imported apart, as nothing but spread waits for it.

  import-lightning-rod:
    needs: [harness, terrain, build-lightning-rod]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - id: cache
        uses: actions/cache@v5
        with:
          path: |
            servers/build/worlds/real/lightning-rod*
            servers/build/worlds/flat/lightning-rod*
          key: import-${{ needs.build-lightning-rod.outputs.key }}-${{ needs.harness.outputs.terrain }}
      - uses: actions/download-artifact@v8
        with:
          pattern: "{terrain,build-lightning-rod}"
          merge-multiple: true
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          tar -xzf terrain.tar.gz
          tar -xzf build-lightning-rod.tar.gz
          ./setup.sh import
      - run: tar -czf import-lightning-rod.tar.gz servers/build/worlds/real/lightning-rod* servers/build/worlds/flat/lightning-rod*
      - uses: actions/upload-artifact@v7
        with:
          name: import-lightning-rod
          path: import-lightning-rod.tar.gz
          retention-days: 1

  import-lightning-rod-wide:
    needs: [harness, terrain-wide, build-lightning-rod]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - id: cache
        uses: actions/cache@v5
        with:
          path: servers/build/worlds/wide/lightning-rod*
          key: import-wide-${{ needs.build-lightning-rod.outputs.key }}-${{ needs.harness.outputs.terrain }}
      - uses: actions/download-artifact@v8
        with:
          pattern: "{wide-vanilla,build-lightning-rod}"
          merge-multiple: true
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          tar -xzf wide-vanilla.tar.gz
          tar -xzf build-lightning-rod.tar.gz
          ./setup.sh import-wide
      - run: tar -czf wide-lightning-rod.tar.gz servers/build/worlds/wide/lightning-rod*
      - uses: actions/upload-artifact@v7
        with:
          name: wide-lightning-rod
          path: wide-lightning-rod.tar.gz
          retention-days: 1

  # SteelMC's worlds: it reads no vanilla worlds, so it generates the same squares of chunks itself,
  # reused for as long as its build and what generates the vanilla ones stay the same. The wide one
  # is generated apart, as nothing but spread waits for it.

  terrain-steel:
    needs: [harness, build-steel]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - id: cache
        uses: actions/cache@v5
        with:
          path: |
            servers/build/worlds/real/steel*
            servers/build/worlds/flat/steel*
          key: terrain-steel-${{ needs.build-steel.outputs.key }}-${{ needs.harness.outputs.terrain }}
      - uses: actions/download-artifact@v8
        with:
          pattern: "{harness,build-steel}"
          merge-multiple: true
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          tar -xzf harness.tar.gz
          tar -xzf build-steel.tar.gz
          ./setup.sh terrain-steel
      - run: tar -czf terrain-steel.tar.gz servers/build/worlds/real/steel* servers/build/worlds/flat/steel*
      - uses: actions/upload-artifact@v7
        with:
          name: terrain-steel
          path: terrain-steel.tar.gz
          retention-days: 1

  terrain-steel-wide:
    needs: [harness, build-steel]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - id: cache
        uses: actions/cache@v5
        with:
          path: servers/build/worlds/wide/steel*
          key: terrain-steel-wide-${{ needs.build-steel.outputs.key }}-${{ needs.harness.outputs.terrain }}
      - uses: actions/download-artifact@v8
        with:
          pattern: "{harness,build-steel}"
          merge-multiple: true
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          tar -xzf harness.tar.gz
          tar -xzf build-steel.tar.gz
          ./setup.sh terrain-steel-wide
      - run: tar -czf wide-steel.tar.gz servers/build/worlds/wide/steel*
      - uses: actions/upload-artifact@v7
        with:
          name: wide-steel
          path: wide-steel.tar.gz
          retention-days: 1

  # Every scenario on a machine of its own, every server in turn, starting once every server and
  # the worlds it runs on are ready.

  idle:
    needs: [build-lightning-rod, import-lightning-rod, build-pumpkin, build-steel, terrain-steel, build-java, terrain]
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/scenario
        with:
          scenario: idle

  wander:
    needs: [build-lightning-rod, import-lightning-rod, build-pumpkin, build-steel, terrain-steel, build-java, terrain]
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/scenario
        with:
          scenario: wander

  spread:
    needs: [build-lightning-rod, import-lightning-rod, import-lightning-rod-wide, build-pumpkin, build-steel, terrain-steel, terrain-steel-wide, build-java, terrain, terrain-wide]
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      # The wide flat world, which only spread runs on.
      - uses: actions/download-artifact@v8
        with:
          pattern: wide-*
          merge-multiple: true
      - uses: ./.github/actions/scenario
        with:
          scenario: spread

  explore:
    needs: [build-lightning-rod, import-lightning-rod, build-pumpkin, build-steel, terrain-steel, build-java, terrain]
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/scenario
        with:
          scenario: explore

  build:
    needs: [build-lightning-rod, import-lightning-rod, build-pumpkin, build-steel, terrain-steel, build-java, terrain]
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/scenario
        with:
          scenario: build

  cows:
    needs: [build-lightning-rod, import-lightning-rod, build-pumpkin, build-steel, terrain-steel, build-java, terrain]
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/scenario
        with:
          scenario: cows

  # Every scenario's results in one report, also when one of them failed. Its charts go to the
  # charts branch, a folder per run, which serves them as images the run's summary can show.
  report:
    needs: [idle, wander, spread, explore, build, cows]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: harness
      - uses: actions/download-artifact@v8
        with:
          pattern: results-*
          path: results
      - run: |
          tar -xzf harness.tar.gz
          mkdir -p runs/standard
          cat results/*/results.jsonl > runs/standard/results.jsonl
          ./zig-out/bin/bench report runs/standard --charts-url="https://raw.githubusercontent.com/${{ github.repository }}/charts/${{ github.run_id }}"
          cat runs/standard/report.md >> "$GITHUB_STEP_SUMMARY"
      - run: |
          if git fetch --depth=1 origin charts; then
            git worktree add charts-branch FETCH_HEAD
          else
            git worktree add --orphan -b charts charts-branch
          fi
          cd charts-branch
          mkdir -p "${{ github.run_id }}"
          cp ../runs/standard/charts/*.svg "${{ github.run_id }}/"
          git add "${{ github.run_id }}"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "charts: run ${{ github.run_id }}"
          # Runs finishing together each add their own folder, so a push that lost the race
          # takes the other's first.
          for _ in 1 2; do
            git push origin HEAD:charts && exit 0
            git pull --rebase --depth=1 origin charts
          done
          git push origin HEAD:charts
      - uses: actions/upload-artifact@v7
        with:
          name: report
          path: |
            runs/standard/report.md
            runs/standard/results.jsonl
            runs/standard/charts
